<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tabla2 colspan y rowspan</title>
</head>
<body>
<h1>Tabla2 colspan y rowspan</h1>

<h2>Tabla2 colspan</h2>
<table border="1" cellspacing="0" cellpadding="6">
  <tr><td><b>A</b></td><td><b>B</b></td><td><b>C</b></td></tr>
  <tr><td>D</td><td>E</td><td>F</td></tr>
  <tr><td>G</td><td>H</td><td>I</td></tr>
  <tr><td></td><td>J</td><td>K</td></tr>
  <tr><td>L</td><td colspan="2">M</td></tr>
  <tr><td colspan="3"><b>N</b></td></tr>
</table>

<h2>Tabla rowspan</h2>
<table border="1" cellspacing="0" cellpadding="6">
  <tr><td rowspan="2">A</td><td>B</td></tr>
  <tr><td>C</td></tr>
  <tr><td rowspan="2">D</td><td>E</td></tr>
  <tr><td>F</td></tr>
</table>

</body>
</html>
